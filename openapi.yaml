openapi: 3.0.4
info:
  title: Cost of Living
  description: >-
    Cost of Living is a cost of living API that returns price-level indices for
    US states and metropolitan areas, with the US average at 100. Compare the
    relative cost of living between two states or cities and calculate salary
    equivalents for relocation decisions on paid plans.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/costliving:
    get:
      summary: Cost of Living
      description: >-
        Get the cost of living index for a specific location. Accepts state
        names, state codes, or city names, which resolve to their metro area.
      operationId: costliving
      parameters:
        - name: location
          in: query
          schema:
            type: string
          required: true
          description: >-
            State name, state code (e.g., CA, NY), or city name (e.g., Chicago,
            or Portland, ME).
          example: California
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  searchedLocation: California
                  region: west-large
                  regionName: West Large Metros (LA, SF, Seattle, Phoenix, Denver area)
                  costIndex: 107
                  description: 7% above average
                  cpi: 356.993
                  usAverageCPI: 334.98
                  period: 2026-08
                  note: >-
                    Cost index is relative to US average (100). Values above 100
                    indicate higher than average cost of living.
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
