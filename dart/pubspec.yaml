name: apiverve_costliving
description: "Cost of Living is a cost of living API that returns price-level indices for US states and metropolitan areas, with the US average at 100. Compare the relative cost of living between two states or cities and calculate salary equivalents for relocation decisions on paid plans."
version: 1.2.6
homepage: https://apiverve.com/marketplace/costliving?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/costliving-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
