name: apiverve_costliving
description: "Cost of Living is a cost of living API that provides index values for US regions based on major metropolitan area data. Compare the relative cost of living between states or cities, each mapped to its Census region, and calculate salary equivalents for relocation decisions on paid plans."
version: 1.2.3
homepage: https://apiverve.com/marketplace/costliving?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/costliving-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
